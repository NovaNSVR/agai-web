name: Deploy to Netlify

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify (production)
        if: github.ref == 'refs/heads/main'
        run: npx netlify-cli deploy --dir=out --prod --message "Production deploy from main"
        env:
          NETLIFY_SITE_ID: 3c2ccbb0-5118-418b-a718-42c6f755e3dd
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Deploy to Netlify (staging)
        if: github.ref == 'refs/heads/staging'
        run: npx netlify-cli deploy --dir=out --alias=staging --message "Staging deploy from staging branch"
        env:
          NETLIFY_SITE_ID: 3c2ccbb0-5118-418b-a718-42c6f755e3dd
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
